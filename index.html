    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "NGINX 为什么能用极少内存撑起高并发连接？",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "它采用异步非阻塞的事件驱动架构。单个 worker 进程在 Linux 上通过 epoll、在 BSD 与 macOS 上通过 kqueue 复用大量 socket，连接状态保存在轻量状态机里，不会为每个客户端分配独立线程或栈内存。"
            }
          },
          {
            "@type": "Question",
            "name": "什么时候应该用 proxy_pass，什么时候用 stream 四层代理？",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "需要按域名、路径、请求头、Cookie 路由或做内容缓存与限流时，使用 http 块下的 proxy_pass；当流量本身不是 HTTP，例如 MySQL、Redis、gRPC 透传或按 SNI 分流加密连接时，使用 stream 块。"
            }
          },
          {
            "@type": "Question",
            "name": "修改配置后执行平滑重载会断开现有用户连接吗？",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "不会。执行重载命令前先进行语法与证书路径校验；重载时 master 进程会启动加载新配置的 worker 接收新连接，老 worker 则在把在途请求全部响应完毕后优雅退出。"
            }
          },
          {
            "@type": "Question",
            "name": "开源版本身支持 HTTP/3 与 QUIC 吗？",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "支持。NGINX 自 1.25.0 起已将 HTTP/3 与 QUIC 模块合入主线。在同一端口同时开启 SSL 与 QUIC 监听并通过响应头通告协议支持后，客户端即可平滑升级或自动回退到 HTTP/2。"
            }
          },
          {
            "@type": "Question",
            "name": "需要限流或缓存时，必须额外引入 Redis 或 Varnish 吗？",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "单机或单实例边缘节点不需要。limit_req_zone 与 proxy_cache 直接将限流桶计数与缓存索引保存在共享内存 zone 中，响应正文落盘存储，多个 worker 之间零锁共享状态。"
            }
          },
          {
            "@type": "Question",
            "name": "如何在不修改上游应用代码的前提下做灰度发布？",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "使用内置的 split_clients 指令即可。它可以对请求中的 Cookie、用户标识或客户端地址做哈希分桶，按百分比把稳定比例的流量切到新版上游集群，无需改动业务代码。"
            }
          }
        ]
      }
    </script>
